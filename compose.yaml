services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: reviewtap_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-mysql://reviewtap_user:reviewtap_pass@db:3306/reviewtap}
      AUTH_TRUST_HOST: "true"
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-change-me-in-your-.env}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-https://reviewtap.in}
      NEXT_PUBLIC_ROOT_DOMAIN: ${NEXT_PUBLIC_ROOT_DOMAIN:-reviewtap.in}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://reviewtap.in}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-sk-placeholder}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: reviewtap_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-reviewtap}
      MYSQL_USER: ${MYSQL_USER:-reviewtap_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-reviewtap_pass}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
